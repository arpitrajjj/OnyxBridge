plugins {
    id 'com.android.library'
}

android {
    namespace 'com.onyx.bridge'
    compileSdk 34

    defaultConfig {
        minSdk     21
        targetSdk  34
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The prebuilt .so files are dropped here by CI before the
            // demo APK is built. Local developers can also place .so
            // files here after running the CMake build.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // Empty — library has no external Java dependencies.
}
