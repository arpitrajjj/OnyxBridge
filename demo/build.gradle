plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onyx.bridge.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.onyx.bridge.demo"
        minSdk     21
        targetSdk  34
        versionCode 2
        versionName "1.1.0"

        ndk {
            // All four ABIs supported by OnyxBridge
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        // Build-time default API URL — empty by default so the user must
        // enter their dashboard URL in the app's config screen at runtime.
        // Override via gradle property: -PAPI_URL="https://your-render.onrender.com"
        def apiFromProperty = project.findProperty("API_URL") ?: ""
        buildConfigField "String", "API_URL", "\"${apiFromProperty}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign with debug for demo purposes so it can be installed easily
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Pre-built .so files land here during CI / after local CMake build
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // OnyxBridge JNI wrapper + native library loader
    implementation project(':app')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.6'
    implementation 'androidx.work:work-runtime:2.9.1'

    // Material Components — Material 3 themes
    implementation 'com.google.android.material:material:1.12.0'

    // Networking — OkHttp for HTTP + JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
