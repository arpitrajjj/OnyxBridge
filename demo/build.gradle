plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onyx.bridge.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.onyx.bridge.demo"
        minSdk     21
        targetSdk  34
        versionCode 1
        versionName "1.0.0"

        ndk {
            // All four ABIs supported by OnyxBridge
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign with debug for demo purposes so it can be installed easily
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Pre-built .so files land here during CI / after local CMake build
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // Use the OnyxBridge library wrapper class
    implementation project(':app')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
